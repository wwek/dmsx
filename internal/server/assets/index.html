<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>dmsx</title>
    <script>document.documentElement.dataset.theme = localStorage.getItem("dmsx.theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");</script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;1,9..144,560&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/app.css">
</head>
<body>
    <section id="gate" class="gate" hidden>
        <form id="gate-form">
            <img class="emblem" src="/favicon.svg" alt="">
            <h1 id="gate-title">登录</h1>
            <p id="gate-copy" class="muted"></p>
            <label>口令<input name="password" type="password" autocomplete="current-password" required></label>
            <button id="gate-submit" class="primary" type="submit">进入</button>
            <p id="gate-error" class="err"></p>
        </form>
    </section>
    <div id="app" class="shell" hidden>
        <aside>
            <div class="brand">
                <img class="emblem" src="/favicon.svg" alt="">
                <div class="mark">dmsx</div>
                <button id="collapse" class="icon-button" type="button" aria-expanded="true" aria-label="收起侧边栏">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
                </button>
            </div>
            <p class="status">自评</p>
            <nav id="nav"></nav>
        </aside>
        <main>
            <header>
                <p id="crumb"></p>
                <div class="header-tools">
                    <span id="health">正在连接</span>
                    <button id="theme" class="icon-button" type="button" aria-label="切换主题"></button>
                    <div class="account">
                        <span class="avatar" aria-hidden="true">
                            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3"/><path d="M5 19c1.5-3 4-4.5 7-4.5S17.5 16 19 19"/></svg>
                        </span>
                        <span>已登录</span>
                        <button id="logout" class="ghost" type="button">退出</button>
                    </div>
                </div>
            </header>
            <p class="disclaimer">免责声明：备份、归档删除和在线切表都可能让数据找不回来。用了 dmsx 之后数据没了，责任在操作者，不要来找作者。先在副本上验证，再动生产库。<a href="https://github.com/wwek/dmsx">github.com/wwek/dmsx</a></p>
            <section id="view"></section>
        </main>
    </div>
    <script src="/app.js"></script>
</body>
</html>

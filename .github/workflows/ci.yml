name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l .)"
      - run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: install gh-ost
        run: |
          set -euo pipefail
          version=1.1.11
          base="https://github.com/github/gh-ost/releases/download/v${version}"
          curl -fsSL -o gh-ost.tar.gz "${base}/gh-ost-linux-amd64.tar.gz"
          curl -fsSL -o SHA256SUMS "${base}/SHA256SUMS"
          grep 'gh-ost-linux-amd64.tar.gz' SHA256SUMS | sha256sum -c -
          tar -xzf gh-ost.tar.gz gh-ost
          sudo install -m 0755 gh-ost /usr/local/bin/gh-ost
          gh-ost --version
      - run: go test -tags e2e -count=1 -timeout 15m ./e2e
